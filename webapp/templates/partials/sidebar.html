<aside class="w-60 shrink-0 bg-surface border-r border-border min-h-[calc(100vh-4rem)]
              fixed lg:sticky top-16 left-0 z-20 lg:translate-x-0 transition-transform duration-150
              -translate-x-full"
       data-sidebar>
  <nav class="p-3 space-y-1">
    {% for item in nav_items %}
      {% if item.endpoint %}
        <a href="{{ url_for(item.endpoint, slug=request.view_args.get('slug')) }}"
           class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors duration-150
                  {% if request.endpoint == item.endpoint %}bg-accent/15 text-accent{% else %}text-secondary hover:bg-surface-hover hover:text-primary{% endif %}">
          {% include "icons/" + item.icon + ".svg" %}
          <span>{{ item.label }}</span>
        </a>
      {% else %}
        <span class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-muted cursor-not-allowed"
              title="Скоро">
          {% include "icons/" + item.icon + ".svg" %}
          <span>{{ item.label }}</span>
        </span>
      {% endif %}
    {% endfor %}
  </nav>
</aside>

{# Затемнение фона при открытом мобильном sidebar #}
<div class="hidden fixed inset-0 bg-black/50 z-10 lg:hidden" data-sidebar-overlay></div>
