<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}bf-analytics{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-page text-primary font-sans min-h-screen">

  <div class="flex">

    <main class="flex-1 min-w-0 p-4 lg:p-6">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="{{ url_for('static', filename='shell.js') }}"></script>

</html>
