  acquiring_bank_name:             { type: String,   aliases: ["Наименование банка-эквайера"] }
  office_number:                   { type: String,   aliases: ["Номер офиса"] }
  delivery_office_name:            { type: String,   aliases: ["Наименование офиса доставки"] }
  partner_inn:                     { type: String,   aliases: ["ИНН партнера"] }
  partner:                         { type: String,   aliases: ["Партнер"] }
  warehouse:                       { type: String,   aliases: ["Склад"] }
