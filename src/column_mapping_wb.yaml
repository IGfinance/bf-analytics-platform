# Соответствие колонок отчёта WB "Еженедельный детализированный отчет"
# каноническим полям в ClickHouse.
#
# Формат: canonical_name -> {type, aliases: [все встречавшиеся варианты написания]}
#
# Как добавлять новую колонку, которую WB ввёл впервые:
#   1. Скрипт ingest_wb.py при загрузке напишет в консоль и в таблицу
#      unmapped_columns_log, что встретил неизвестный заголовок.
#   2. Откройте этот файл, решите: это опечатка/пробел в старом названии
#      (добавьте в aliases к существующему полю) или правда новое поле
#      (добавьте новую запись ниже + ALTER TABLE ADD COLUMN в ClickHouse).

columns:
  row_num:                         { type: Int32,    aliases: ["№"] }
  supply_number:                   { type: String,   aliases: ["Номер поставки"] }
  subject_category:                { type: String,   aliases: ["Предмет"] }
  nomenclature_code:                { type: String,   aliases: ["Код номенклатуры"] }
  brand:                           { type: String,   aliases: ["Бренд"] }
  supplier_article:                { type: String,   aliases: ["Артикул поставщика"] }
  product_name:                    { type: String,   aliases: ["Название"] }
  size:                            { type: String,   aliases: ["Размер"] }
  barcode:                         { type: String,   aliases: ["Баркод"] }
  document_type:                   { type: String,   aliases: ["Тип документа"] }
  payment_reason:                  { type: String,   aliases: ["Обоснование для оплаты"] }
  order_date:                      { type: Date,     aliases: ["Дата заказа покупателем"] }
  sale_date:                       { type: Date,     aliases: ["Дата продажи"] }
  qty:                             { type: Int32,    aliases: ["Кол-во"] }
  retail_price:                    { type: Float64,  aliases: ["Цена розничная"] }
  wb_realized_amount:              { type: Float64,  aliases: ["Вайлдберриз реализовал Товар (Пр)"] }
  agreed_product_discount_pct:     { type: Float64,  aliases: ["Согласованный продуктовый дисконт, %"] }
  promo_code_pct:                  { type: Float64,  aliases: ["Промокод, %"] }
  total_agreed_discount_pct:       { type: Float64,  aliases: ["Итоговая согласованная скидка, %"] }
  retail_price_with_discount:      { type: Float64,  aliases: ["Цена розничная с учетом согласованной скидки"] }
  kvv_reduction_rating_pct:        { type: Float64,  aliases: ["Размер снижения кВВ из-за рейтинга, %"] }
  kvv_change_promo_pct:            { type: Float64,  aliases: ["Размер изменения кВВ из-за акции, %"] }
  platform_discount_pct:           { type: Float64,  aliases: ["Платформенные скидки, %"] }
  kvv_pct:                         { type: Float64,  aliases: ["Размер кВВ, %"] }
  kvv_base_excl_vat_pct:
    type: Float64
    aliases:
      - "Размер  кВВ без НДС, % Базовый"   # актуальный вариант (двойной пробел)
      - "Размер кВВ без НДС, % Базовый"    # старый вариант (одинарный пробел)
  total_kvv_excl_vat_pct:          { type: Float64,  aliases: ["Итоговый кВВ без НДС, %"] }
  sales_commission_before_agent_fee_excl_vat: { type: Float64, aliases: ["Вознаграждение с продаж до вычета услуг поверенного, без НДС"] }
  pvz_handling_compensation:       { type: Float64,  aliases: ["Возмещение за выдачу и возврат товаров на ПВЗ"] }
  payment_services_compensation:   { type: Float64,  aliases: ["Компенсация платёжных услуг/Комиссия за интеграцию платёжных сервисов"] }
  payment_services_compensation_pct: { type: Float64, aliases: ["Размер компенсации платёжных услуг/Комиссии за интеграцию платёжных сервисов, %"] }
  payment_compensation_type:       { type: String,   aliases: ["Тип платежа: компенсация платёжных услуг/Комиссия за интеграцию платёжных сервисов"] }
  wb_commission_excl_vat:          { type: Float64,  aliases: ["Вознаграждение Вайлдберриз (ВВ), без НДС"] }
  vat_on_wb_commission:            { type: Float64,  aliases: ["НДС с Вознаграждения Вайлдберриз"] }
  payable_to_seller:               { type: Float64,  aliases: ["К перечислению Продавцу за реализованный Товар"] }
